[project]
name = "e-commerce-after-sale-mult-agent"
version = "0.2.0"
description = "多角色协同的电商售后工单与 AI Agent 系统"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.5",
    "openai>=3.57.0",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pymysql>=1.2.4",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
